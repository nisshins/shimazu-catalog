name: Update hall catalog

on:
  push:
    branches:
      - main
    paths:
      - 'docs/index.html'
      - 'docs/privacy.html'
      - 'docs/machines.json'
      - 'scripts/build_machine_catalog.py'
      - 'scripts/build_notice_catalog.py'
      - 'scripts/test_notice_catalog.py'
      - 'scripts/match_manufacturer_names.py'
      - 'scripts/test_manufacturer_names.py'
      - 'scripts/machine-catalog-requirements.txt'
      - 'data/machine-name-overrides.json'
      - '.github/workflows/update-hall-catalog.yml'
  schedule:
    # Every Monday at 12:23 JST (03:23 UTC).
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hall-catalog-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download P-Lens parlor data
        run: |
          curl --fail --location --retry 3 --output parlors.jsonl https://parlors.p-lens.jp/parlors.jsonl
          curl --fail --location --retry 3 --output unplaced.jsonl https://parlors.p-lens.jp/unplaced.jsonl

      - name: Build app catalog
        run: python scripts/build_hall_catalog.py parlors.jsonl unplaced.jsonl docs/halls.json

      - name: Install notice PDF parser
        run: python -m pip install -r scripts/machine-catalog-requirements.txt

      - uses: actions/cache@v4
        with:
          path: .cache/machine-notices
          key: machine-notices-v1-${{ github.run_id }}
          restore-keys: machine-notices-v1-

      - name: Test notice catalog parser
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Build machine catalog from official notices
        run: python scripts/build_notice_catalog.py

      - name: Match manufacturer product names
        run: python scripts/match_manufacturer_names.py

      - name: Commit updated catalog
        run: |
          git add docs/halls.json docs/machines.json docs/machine-name-match-report.json data/manufacturer-products.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update hall and examination machine catalogs'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
