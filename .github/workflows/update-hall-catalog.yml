name: Update hall catalog

on:
  push:
    branches:
      - main
    paths:
      - 'docs/index.html'
      - 'docs/privacy.html'
      - 'docs/machines.json'
      - 'scripts/build_machine_catalog.py'
      - '.github/workflows/update-hall-catalog.yml'
  schedule:
    # Every Monday at 12:23 JST (03:23 UTC).
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hall-catalog-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download P-Lens parlor data
        run: |
          curl --fail --location --retry 3 --output parlors.jsonl https://parlors.p-lens.jp/parlors.jsonl
          curl --fail --location --retry 3 --output unplaced.jsonl https://parlors.p-lens.jp/unplaced.jsonl

      - name: Build app catalog
        run: python scripts/build_hall_catalog.py parlors.jsonl unplaced.jsonl docs/halls.json

      - name: Download licensed machine data
        if: ${{ vars.MACHINE_CATALOG_SOURCE_URL != '' }}
        env:
          MACHINE_SOURCE_URL: ${{ vars.MACHINE_CATALOG_SOURCE_URL }}
        run: curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --output machines-source.json "$MACHINE_SOURCE_URL"

      - name: Build machine catalog
        if: ${{ vars.MACHINE_CATALOG_SOURCE_URL != '' }}
        env:
          MACHINE_SOURCE_NAME: ${{ vars.MACHINE_CATALOG_SOURCE_NAME }}
          MACHINE_ATTRIBUTION: ${{ vars.MACHINE_CATALOG_ATTRIBUTION }}
          MACHINE_LICENSE: ${{ vars.MACHINE_CATALOG_LICENSE }}
        run: >-
          python scripts/build_machine_catalog.py machines-source.json docs/machines.json
          --source "$MACHINE_SOURCE_NAME"
          --attribution "$MACHINE_ATTRIBUTION"
          --license "$MACHINE_LICENSE"

      - name: Commit updated catalog
        run: |
          git add docs/halls.json docs/machines.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update nationwide hall catalog'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
