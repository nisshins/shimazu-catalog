name: Update hall catalog

on:
  schedule:
    # Every Monday at 12:23 JST (03:23 UTC).
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hall-catalog-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download P-Lens parlor data
        run: |
          curl --fail --location --retry 3 --output parlors.jsonl https://parlors.p-lens.jp/parlors.jsonl
          curl --fail --location --retry 3 --output unplaced.jsonl https://parlors.p-lens.jp/unplaced.jsonl

      - name: Build nationwide hall catalog
        run: |
          mkdir -p docs
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          def read_jsonl(path):
              with Path(path).open(encoding='utf-8') as source:
                  return [json.loads(line) for line in source if line.strip()]

          def text(value):
              if not isinstance(value, str):
                  return None
              value = ' '.join(value.split()).strip()
              return value if 0 < len(value) <= 200 else None

          halls_by_id = {}
          for source in read_jsonl('parlors.jsonl') + read_jsonl('unplaced.jsonl'):
              required = {key: text(source.get(key)) for key in ('id', 'name', 'reading', 'prefecture', 'checked')}
              if not all(required.values()):
                  raise ValueError(f"Required field missing: {source.get('id', '<unknown>')}")
              if required['id'] in halls_by_id:
                  raise ValueError(f"Duplicate hall id: {required['id']}")
              hall = required
              keywords = [item for value in source.get('keywords', []) if (item := text(value))]
              if keywords:
                  hall['keywords'] = keywords
              for key in ('branchReading', 'address', 'officialName', 'officialUrl'):
                  if value := text(source.get(key)):
                      hall[key] = value
              for key in ('lat', 'lon'):
                  value = source.get(key)
                  if isinstance(value, (int, float)) and not isinstance(value, bool):
                      hall[key] = value
              halls_by_id[hall['id']] = hall

          halls = sorted(halls_by_id.values(), key=lambda hall: (hall['prefecture'], hall['reading'], hall['name'], hall['id']))
          if len(halls) < 3000:
              raise RuntimeError(f'Only {len(halls)} halls found; refusing to publish')
          catalog = {
              'version': 2,
              'generatedAt': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source': 'P-Lens parlors',
              'sourceUrl': 'https://github.com/p-lens/p-lens-parlors',
              'license': 'ODbL-1.0',
              'licenseUrl': 'https://opendatacommons.org/licenses/odbl/1-0/',
              'attribution': '© P-Lens contributors, © OpenStreetMap contributors',
              'halls': halls,
          }
          Path('docs/halls.json').write_text(json.dumps(catalog, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'Wrote {len(halls)} halls')
          PY

          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>島図作成アプリ 全国ホールカタログ</title>
          <body><h1>島図作成アプリ 全国ホールカタログ</h1><p><a href="halls.json">halls.json</a></p>
          <p><a href="https://github.com/p-lens/p-lens-parlors">© P-Lens contributors</a>, <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></p>
          <p><a href="https://opendatacommons.org/licenses/odbl/1-0/">Open Database License 1.0</a></p></body></html>
          HTML

          cat > LICENSE <<'TEXT'
          The database in docs/halls.json is made available under the Open Database License 1.0:
          https://opendatacommons.org/licenses/odbl/1-0/
          Attribution: © P-Lens contributors, © OpenStreetMap contributors
          TEXT

      - name: Commit updated catalog
        run: |
          git add docs LICENSE
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update nationwide hall catalog'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
